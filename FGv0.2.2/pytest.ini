[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --tb=short
# Per-test ceiling (pytest-timeout): no single test may hang a build gate
# indefinitely. A test that hits the ceiling FAILS, with its name and a
# stack dump in the log, instead of stalling the job until the outer
# workflow timeout kills it in silence.
timeout = 300
filterwarnings =
    ignore::DeprecationWarning:fpdf.*
