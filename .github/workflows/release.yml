# FrameGuard release pipeline — audited design: docs/RELEASE_PLAN.md
#
# HOW A RELEASE HAPPENS:
#   1. Bump the version in the four places validate_version.py checks
#      (frameguard/__init__.py, frameguard.spec, installer.iss,
#      version.json — changelog lives in version.json), commit, push main.
#   2. Wait for Tests and Release Candidate to pass on that exact commit SHA.
#      The candidate proves the installed Windows package and both native DMGs.
#   3. Tag that proven commit: git tag -a v0.8.0 -m "FrameGuard v0.8.0"
#      and push the tag. This workflow rejects any unproven tag target.
#   4. Enable immutable releases in repo settings (Settings -> General ->
#      Releases) and keep the publish job's `release` environment
#      restricted to v* tags with yourself as reviewer. A published
#      release can then never be altered: draft -> verify -> publish.
#
# WHAT A RELEASE SHIPS:
#   FrameGuardInstaller.exe (Windows 10/11 x64), FrameGuard-arm64.dmg and
#   FrameGuard-intel.dmg (macOS 12+, per architecture), SHA256SUMS.txt,
#   one CycloneDX SBOM per platform and a build provenance attestation
#   per binary (verify: gh attestation verify). Installed copies discover
#   the matching full installer through GitHub Releases. Publisher:
#   Capri la Ria. Developer: Cassian Aléria.
#
# SIGNING STATE (deliberate, zero budget — see CODE_SIGNING_POLICY.md):
#   Windows unsigned (SmartScreen: More info -> Run anyway); macOS ad-hoc
#   signed, not notarized (macOS 15+: System Settings -> Privacy &
#   Security -> Open Anyway). If Apple secrets are ever added
#   (MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD),
#   build_mac.sh signs with the Developer ID and notarizes unchanged.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.5.6"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  APP_DIR: src
  PIP_CONSTRAINT: ${{ github.workspace }}/src/constraints-3.12.txt

# One release at a time, per tag; a re-run never cancels a half-publish.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Least privilege: read-only everywhere except the publish job, which
# restates exactly the extra permissions it needs.
permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify tag matches version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.candidate.outputs.release_sha }}
      tag_object_sha: ${{ steps.candidate.outputs.tag_object_sha }}
      candidate_run_id: ${{ steps.candidate.outputs.candidate_run_id }}
    steps:
      - name: Require an existing tag ref for manual releases
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Manual releases require a semantic version tag such as v0.6.1."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/${REQUESTED_TAG}" ]]; then
            echo "::error::Dispatch this workflow from refs/tags/${REQUESTED_TAG}, not ${GITHUB_REF}."
            exit 1
          fi
          gh api --silent \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REQUESTED_TAG}" || {
              echo "::error::Tag ref refs/tags/${REQUESTED_TAG} does not exist."
              exit 1
            }

      - name: Check out the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Require an annotated release tag
        run: |
          set -euo pipefail
          TAG_TYPE="$(git cat-file -t "refs/tags/${RELEASE_TAG}")"
          if [[ "$TAG_TYPE" != "tag" ]]; then
            echo "::error::$RELEASE_TAG is a lightweight tag. Releases require an annotated tag."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: src/.python-version

      - name: Validate the four version sources agree
        working-directory: ${{ env.APP_DIR }}
        run: python validate_version.py

      - name: Fail if the tag is not the version in the tree
        id: version
        working-directory: ${{ env.APP_DIR }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("version.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match version.json ($VERSION). Bump the version or fix the tag."
            exit 1
          fi
          echo "Tag $RELEASE_TAG == version $VERSION"

      - name: Require successful source and native candidate runs for this commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          TAG_OBJECT_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          CANDIDATE_RUNS="$RUNNER_TEMP/frameguard-candidate-runs.json"
          TEST_RUNS="$RUNNER_TEMP/frameguard-test-runs.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-candidate.yml/runs?head_sha=${RELEASE_SHA}&status=success&per_page=20" \
            > "$CANDIDATE_RUNS"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?head_sha=${RELEASE_SHA}&status=success&per_page=20" \
            > "$TEST_RUNS"
          python - "$CANDIDATE_RUNS" "$TEST_RUNS" "$RELEASE_SHA" \
            "$TAG_OBJECT_SHA" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          (candidate_path, tests_path, expected_sha, tag_object_sha,
           output_path, summary_path) = sys.argv[1:]

          def matching_runs(path, events):
              payload = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              return [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == expected_sha
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("event") in events
              ]

          candidates = matching_runs(candidate_path, {"push", "workflow_dispatch"})
          tests = [
              run for run in matching_runs(tests_path, {"push"})
              if run.get("head_branch") == "main"
          ]
          if not candidates:
              raise SystemExit(
                  "No successful Release Candidate run exists for exact commit "
                  f"{expected_sha}. The tag cannot build or publish."
              )
          if not tests:
              raise SystemExit(
                  "No successful main-push Tests run exists for exact commit "
                  f"{expected_sha}. The tag cannot build or publish."
              )
          candidate = max(candidates, key=lambda run: run.get("run_number", 0))
          test_run = max(tests, key=lambda run: run.get("run_number", 0))
          with open(output_path, "a", encoding="utf-8") as stream:
              stream.write(f"release_sha={expected_sha}\n")
              stream.write(f"tag_object_sha={tag_object_sha}\n")
              stream.write(f"candidate_run_id={candidate['id']}\n")
          with open(summary_path, "a", encoding="utf-8") as stream:
              stream.write("## Exact-SHA release authorization\n\n")
              stream.write(f"- Commit: `{expected_sha}`\n")
              stream.write(f"- Tests run: [{test_run['id']}]({test_run['html_url']})\n")
              stream.write(f"- Candidate run: [{candidate['id']}]({candidate['html_url']})\n")
          print(f"Exact-SHA Tests authorized by {test_run['html_url']}")
          print(f"Exact-SHA candidate authorized by {candidate['html_url']}")
          PY

      - name: Build the release notes from version.json
        run: |
          python - <<'PY'
          import json, os
          with open(os.path.join(os.environ["APP_DIR"], "version.json"), encoding="utf-8") as f:
              data = json.load(f)
          notes = f"""**Published by Capri la Ria · Developed by Cassian Aléria**

          ## Download

          | Platform | File | Requirements |
          |----------|------|----------------|
          | Windows | `FrameGuardInstaller.exe` | Windows 10/11, 64-bit |
          | macOS (Apple Silicon) | `FrameGuard-arm64.dmg` | macOS 12 or later |
          | macOS (Intel) | `FrameGuard-intel.dmg` | macOS 12 or later |

          **Windows:** run the installer. FrameGuard is not yet code-signed, so
          SmartScreen may ask once — choose "More info", then "Run anyway".

          **macOS:** open the DMG for your Mac's chip and drag FrameGuard into
          Applications. The build is ad-hoc signed but not notarized, so the
          first launch is blocked once. On macOS 15 or later: choose **Done** in
          the dialog, then System Settings → Privacy & Security →
          **Open Anyway**, authenticate, and launch again. On macOS 14 or
          earlier: right-click FrameGuard → **Open**.

          **Already installed?** FrameGuard checks GitHub Releases automatically
          and offers the correct installer for this platform and architecture.
          Reinstalling from this page is always a supported recovery path.

          ## Verify your download

          - Checksums: `SHA256SUMS.txt` (Windows `Get-FileHash`, macOS
            `shasum -a 256 -c SHA256SUMS.txt`)
          - Provenance: `gh attestation verify <file> --owner cass-ale`
          - Components: `sbom-windows.cdx.json` / `sbom-macos.cdx.json`

          ## Changes

          ```
          {data.get("changelog", "").strip()}
          ```

          © 2026 Cassian Aléria. MIT License.
          """
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          print("release-notes.md written")
          PY

      - name: Save the release notes for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          overwrite: true
          path: release-notes.md
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: src/.python-version

      - name: Ensure Inno Setup 6 is available (detect first)
        shell: pwsh
        run: |
          # The windows-2025 image already ships Inno Setup 6.7.1, and a
          # pinned Chocolatey install FAILS over it (no downgrades). Only
          # install, unpinned, when ISCC.exe is genuinely missing.
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          if ($candidates | Where-Object { Test-Path $_ }) {
            Write-Host "Inno Setup found preinstalled."
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
            Write-Host "Inno Setup found on PATH."
          } else {
            choco install innosetup -y --no-progress
          }
          $found = ($candidates | Where-Object { Test-Path $_ }) -or
                   (Get-Command iscc -ErrorAction SilentlyContinue)
          if (-not $found) { throw "Inno Setup (ISCC.exe) is not available." }

      - name: Build and installed-smoke the installer (full gated build)
        timeout-minutes: 75
        shell: cmd
        # build_installer.bat guards its `pause` calls with
        # `if not defined CI` — under Actions they are skipped entirely.
        run: build_installer.bat --skip-delta

      - name: Verify the build outputs exist
        shell: cmd
        run: |
          if not exist "Output\FrameGuardInstaller.exe" exit /b 1
          dir Output

      - name: Smoke test the final Windows installer
        timeout-minutes: 12
        shell: pwsh
        run: >-
          ./tools_dev/windows_installer_smoke.ps1
          -Installer Output/FrameGuardInstaller.exe
          -ArtifactsDir Output/build-logs/workflow-installed-smoke
          -Python ./.buildenv/Scripts/python.exe

      - name: Generate the SBOM from the frozen build environment
        # Non-gating by design (RELEASE_PLAN D8): a broken SBOM tool must
        # never block a release. From the venv's pip freeze — never by
        # scanning the PyInstaller bundle, which under-reports Python deps.
        continue-on-error: true
        shell: pwsh
        run: |
          .\.buildenv\Scripts\python.exe -m pip freeze > sbom-freeze.txt
          python -m venv .sbomtools
          .\.sbomtools\Scripts\python.exe -m pip install --quiet --constraint "$env:PIP_CONSTRAINT" cyclonedx-bom
          .\.sbomtools\Scripts\cyclonedx-py.exe requirements sbom-freeze.txt --output-reproducible -o sbom-windows.cdx.json
          Get-Item sbom-windows.cdx.json

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer
          overwrite: true
          path: src/Output/FrameGuardInstaller.exe
          if-no-files-found: error

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-sbom
          overwrite: true
          path: src/sbom-windows.cdx.json
          if-no-files-found: warn

      - name: Upload Windows build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-build-logs
          overwrite: true
          path: src/Output/build-logs/
          if-no-files-found: warn

  build-macos:
    name: Build macOS DMG (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runner: macos-15
            target_arch: arm64
            artifact: macos-arm64
          - label: intel
            runner: macos-15-intel
            target_arch: x86_64
            artifact: macos-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        working-directory: src
    env:
      FRAMEGUARD_MAC_BUILD_ROOT: ${{ github.workspace }}/.frameguard-build/${{ matrix.label }}
      FRAMEGUARD_TARGET_ARCH: ${{ matrix.target_arch }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: src/.python-version

      - name: Configure the optional Developer ID certificate
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGN_IDENTITY" ]]; then
            if [[ -n "$CERTIFICATE_P12_BASE64" || -n "$CERTIFICATE_PASSWORD" \
                  || -n "$APPLE_ID" || -n "$APPLE_TEAM_ID" \
                  || -n "$APPLE_APP_PASSWORD" ]]; then
              echo "::error::macOS signing/notarization secrets require MACOS_SIGN_IDENTITY."
              exit 1
            fi
            echo "No Developer ID configured; the build will use an ad-hoc signature."
            exit 0
          fi
          if [[ -z "$CERTIFICATE_P12_BASE64" || -z "$CERTIFICATE_PASSWORD" \
                || -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" \
                || -z "$APPLE_APP_PASSWORD" ]]; then
            echo "::error::Official macOS releases require the certificate and all notarization secrets."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/frameguard-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/frameguard-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          python - "$CERTIFICATE" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_P12_BASE64"], validate=True)
          )
          PY
          chmod 600 "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '\"')"
          # shellcheck disable=SC2086 -- security expects one argument per keychain.
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -F -- "$SIGN_IDENTITY"

      - name: Build the DMG (full gated build)
        timeout-minutes: 105
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p "$FRAMEGUARD_MAC_BUILD_ROOT"
          bash build_mac.sh --skip-delta 2>&1 | tee "$FRAMEGUARD_MAC_BUILD_ROOT/build.log"

      - name: Remove the temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/frameguard-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/frameguard-signing.p12"

      - name: Verify the build outputs exist
        timeout-minutes: 5
        run: |
          ls -lh Output/
          test -s Output/FrameGuard.dmg
          BUNDLE=
          BUNDLE="$FRAMEGUARD_MAC_BUILD_ROOT/dist/FrameGuard.app"
          test -d "$BUNDLE"
          codesign --verify --deep --strict "$BUNDLE"

      - name: Smoke test the final mounted and copied DMG
        timeout-minutes: 5
        run: >-
          "$FRAMEGUARD_MAC_BUILD_ROOT/venv/bin/python"
          tools_dev/macos_package_smoke.py
          --dmg Output/FrameGuard.dmg
          --expected-arch "${{ matrix.target_arch }}"
          --artifacts-dir "$FRAMEGUARD_MAC_BUILD_ROOT/logs/workflow-dmg-smoke"
          --qpa cocoa

      - name: Generate the SBOM from the frozen build environment
        if: matrix.label == 'arm64' # identical dependency set on Intel
        continue-on-error: true
        run: |
          VENV_PY="$FRAMEGUARD_MAC_BUILD_ROOT/venv/bin/python"
          "$VENV_PY" -m pip freeze > sbom-freeze.txt
          python3 -m venv .sbomtools
          ./.sbomtools/bin/pip install --quiet --constraint "$PIP_CONSTRAINT" cyclonedx-bom
          ./.sbomtools/bin/cyclonedx-py requirements sbom-freeze.txt --output-reproducible -o sbom-macos.cdx.json
          ls -lh sbom-macos.cdx.json

      - name: Upload the DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}-dmg
          overwrite: true
          path: src/Output/FrameGuard.dmg
          if-no-files-found: error

      - name: Upload the SBOM
        if: matrix.label == 'arm64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-sbom
          overwrite: true
          path: src/sbom-macos.cdx.json
          if-no-files-found: warn

      - name: Upload macOS build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-${{ matrix.label }}-build-log
          overwrite: true
          path: |
            ${{ env.FRAMEGUARD_MAC_BUILD_ROOT }}/build.log
            ${{ env.FRAMEGUARD_MAC_BUILD_ROOT }}/logs/
          include-hidden-files: true
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: [verify, build-windows, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_REPO: ${{ github.repository }}
      VERIFIED_RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
      VERIFIED_TAG_OBJECT_SHA: ${{ needs.verify.outputs.tag_object_sha }}
    # Serialize latest-release selection and undraft operations across tags.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    # Repo settings gate this job: environment `release`, deployment
    # limited to v* tags, maintainer as required reviewer (do NOT enable
    # prevent-self-review — solo maintainer). See RELEASE_PLAN §3.
    environment: release
    permissions:
      contents: write # create and publish the GitHub Release
      id-token: write # OIDC for the Sigstore attestations below
      attestations: write
    steps:
      - name: Download all build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist

      - name: Stage the release assets under their published names
        run: |
          set -euo pipefail
          rm -rf stage
          mkdir stage
          cp dist/windows-installer/FrameGuardInstaller.exe stage/
          cp dist/macos-arm64-dmg/FrameGuard.dmg stage/FrameGuard-arm64.dmg
          cp dist/macos-intel-dmg/FrameGuard.dmg stage/FrameGuard-intel.dmg
          # SBOMs are non-gating: include whichever were produced.
          cp dist/windows-sbom/sbom-windows.cdx.json stage/ 2>/dev/null || echo "no windows SBOM"
          cp dist/macos-sbom/sbom-macos.cdx.json stage/ 2>/dev/null || echo "no macos SBOM"
          (cd stage && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Refuse to alter an already published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is already published and immutable; refusing to alter it."
              exit 1
            fi
          fi

      - name: Refuse to supersede a newer published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_RESPONSE="${RUNNER_TEMP}/frameguard-latest-release.json"
          LATEST_STATUS="$(curl --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "$LATEST_RESPONSE" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/latest")"
          case "$LATEST_STATUS" in
            200) LATEST_TAG="$(jq -er '.tag_name' "$LATEST_RESPONSE")" ;;
            404)
              echo "No published release exists yet; ${RELEASE_TAG} may become latest."
              exit 0
              ;;
            *)
              echo "::error::Could not inspect the latest release (HTTP ${LATEST_STATUS})."
              cat "$LATEST_RESPONSE" >&2
              exit 1
              ;;
          esac
          python - "$RELEASE_TAG" "$LATEST_TAG" <<'PY'
          import re
          import sys

          def version(value):
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", value or "")
              if not match:
                  raise SystemExit(f"Invalid release version: {value!r}")
              return tuple(map(int, match.groups()))

          candidate_text, latest_text = sys.argv[1:]
          if version(candidate_text) < version(latest_text):
              raise SystemExit(
                  f"Refusing to mark {candidate_text} latest because "
                  f"{latest_text} is already published."
              )
          print(f"Version order OK: {candidate_text} >= {latest_text}")
          PY

      - name: Attest build provenance for the binaries
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: |
            stage/FrameGuardInstaller.exe
            stage/FrameGuard-arm64.dmg
            stage/FrameGuard-intel.dmg

      - name: Create or reconcile the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          REF_TYPE="$(jq -r '.object.type' <<<"$REF_JSON")"
          REF_OBJECT="$(jq -r '.object.sha' <<<"$REF_JSON")"
          if [[ "$REF_TYPE" != "tag" || "$REF_OBJECT" != "$VERIFIED_TAG_OBJECT_SHA" ]]; then
            echo "::error::$RELEASE_TAG tag object changed before draft reconciliation."
            exit 1
          fi
          TAG_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REF_OBJECT}")"
          CURRENT_SHA="$(jq -r 'select(.object.type == "commit") | .object.sha' <<<"$TAG_JSON")"
          if [[ -z "$CURRENT_SHA" || "$CURRENT_SHA" != "$VERIFIED_RELEASE_SHA" ]]; then
            echo "::error::$RELEASE_TAG now targets ${CURRENT_SHA:-unknown}, expected $VERIFIED_RELEASE_SHA."
            exit 1
          fi

          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is already published and immutable; refusing to alter it."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --title "FrameGuard $RELEASE_TAG" \
              --notes-file dist/release-notes/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "FrameGuard $RELEASE_TAG" \
              --notes-file dist/release-notes/release-notes.md \
              --draft
          fi

          python - <<'PY'
          from pathlib import Path
          names = sorted(path.name for path in Path("stage").iterdir() if path.is_file())
          Path("expected-names.txt").write_text("".join(f"{name}\n" for name in names), encoding="utf-8")
          PY
          while IFS= read -r asset; do
            if ! grep -Fxq "$asset" expected-names.txt; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)

          gh release upload "$RELEASE_TAG" stage/* --clobber

          python - <<'PY'
          from pathlib import Path
          rows = sorted(
              (path.name, path.stat().st_size)
              for path in Path("stage").iterdir()
              if path.is_file()
          )
          Path("expected-assets.tsv").write_text(
              "".join(f"{name}\t{size}\n" for name, size in rows),
              encoding="utf-8",
          )
          PY
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true"
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | [.name, (.size | tostring)] | @tsv' \
            | LC_ALL=C sort > uploaded-assets.tsv
          diff -u expected-assets.tsv uploaded-assets.tsv
          echo "Draft asset names and sizes verified: $(wc -l < uploaded-assets.tsv) assets"

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          REF_TYPE="$(jq -r '.object.type' <<<"$REF_JSON")"
          REF_OBJECT="$(jq -r '.object.sha' <<<"$REF_JSON")"
          if [[ "$REF_TYPE" != "tag" || "$REF_OBJECT" != "$VERIFIED_TAG_OBJECT_SHA" ]]; then
            echo "::error::$RELEASE_TAG tag object changed before publication."
            exit 1
          fi
          TAG_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REF_OBJECT}")"
          CURRENT_SHA="$(jq -r 'select(.object.type == "commit") | .object.sha' <<<"$TAG_JSON")"
          if [[ -z "$CURRENT_SHA" || "$CURRENT_SHA" != "$VERIFIED_RELEASE_SHA" ]]; then
            echo "::error::$RELEASE_TAG moved before publication: ${CURRENT_SHA:-unknown} != $VERIFIED_RELEASE_SHA."
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG is no longer the verified draft."
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | [.name, (.size | tostring)] | @tsv' \
            | LC_ALL=C sort > uploaded-assets-final.tsv
          diff -u expected-assets.tsv uploaded-assets-final.tsv
          gh release edit "$RELEASE_TAG" --draft=false --latest
