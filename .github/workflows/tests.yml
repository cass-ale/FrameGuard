# Run the complete suite on every supported release runner before changes land.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test suite (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2025
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/src/constraints-3.12.txt
      QT_QPA_PLATFORM: offscreen
      FRAMEGUARD_VISUAL_ARTIFACTS: visual-test-artifacts
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: src/.python-version

      - name: Install constrained dependencies
        run: python -m pip install --constraint constraints-3.12.txt --requirement requirements-dev.txt

      - name: Run the full test suite
        run: python -m pytest --verbose

      # Qt reads its scale factor before QApplication construction, so the
      # audit launcher creates one bounded subprocess per supported scale.
      - name: Audit rendered UI across supported DPI scales
        run: >-
          python tools_dev/gui_audit.py --matrix
          --json-dir gui-audit-artifacts
          --artifacts-dir gui-audit-artifacts/screenshots

      - name: Upload actionable visual evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: visual-evidence-${{ matrix.runner }}
          path: |
            src/gui-audit-artifacts/
            src/visual-test-artifacts/
          if-no-files-found: warn
          retention-days: 14
