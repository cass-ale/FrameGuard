# Run the complete suite on every supported release runner before changes land.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test suite (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2025
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/src/constraints-3.12.txt
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: src/.python-version

      - name: Install constrained dependencies
        run: python -m pip install --constraint constraints-3.12.txt --requirement requirements-dev.txt

      - name: Run the full test suite
        run: python -m pytest --verbose
