# Keeps the SHA-pinned actions in release.yml current: Dependabot
# understands SHA pins and preserves the trailing version comments.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # One pull request for all action bumps: each needs the same manual pin
    # review in src/tests/test_workflow_contracts.py, so reviewing them
    # together avoids three PRs failing CI separately.
    groups:
      github-actions:
        patterns:
          - "*"
